<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音识别后台管理系统 - 参数设置</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .form-section {
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .form-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        
        .form-section h3 {
            margin-bottom: 16px;
            color: #333;
            font-size: 16px;
            font-weight: 500;
        }
        
        /* 参数设置卡片滚动条 */
        .settings-card {
            max-height: calc(100vh - 150px);
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>语音识别后台管理系统</h1>
            <div class="user-info">
                <span id="username">加载中...</span>
                <button id="btn-logout" class="btn-logout">登出</button>
            </div>
        </div>
        
        <div class="main-content">
            <div class="sidebar">
                <h3>功能导航</h3>
                <ul>
                    <li><a href="dashboard.html">控制台</a></li>
                    <li><a href="keywords.html">专业术语管理</a></li>
                    <li><a href="settings.html" class="active">参数设置</a></li>
                    <li><a href="wakewords.html">唤醒词管理</a></li>
                    <li><a href="sdk-guide.html">WhisperLiveKit Web SDK 使用手册</a></li>
                </ul>
            </div>
            
            <div class="content">
                <h2>参数设置</h2>
                
                <div class="card settings-card">
                    <div class="card-title">系统参数配置</div>
                    <form id="settings-form">
                        <div class="form-section">
                            <h3>服务设置</h3>
                            <div class="form-row">
                                <label for="host">服务主机地址</label>
                                <input type="text" id="host" name="host" value="0.0.0.0">
                            </div>
                            
                            <div class="form-row">
                                <label for="port">服务端口</label>
                                <input type="number" id="port" name="port" min="1024" max="65535" value="8000">
                            </div>
                            
                            <div class="form-row">
                                <label for="log_level">日志级别</label>
                                <select id="log_level" name="log_level">
                                    <option value="DEBUG">DEBUG</option>
                                    <option value="INFO" selected>INFO</option>
                                    <option value="WARNING">WARNING</option>
                                    <option value="ERROR">ERROR</option>
                                    <option value="CRITICAL">CRITICAL</option>
                                </select>
                            </div>
                            
                            <div class="form-row" style="text-align: left;">
                                <label for="backend_policy">后端策略</label>
                                <input type="text" id="backend_policy" name="backend_policy" value="localagreement" readonly style="background-color: #f5f5f5;">
                            </div>
                        </div>
                        
                        <div class="form-section">
                            <h3>模型设置</h3>
                            <div class="form-row">
                                <label for="model">模型类型</label>
                                <select id="model" name="model">
                                    <option value="tiny" selected>tiny</option>
                                    <option value="base">base</option>
                                    <option value="small">small</option>
                                    <option value="medium">medium</option>
                                    <option value="large">large</option>
                                    <option value="large-v2">large-v2</option>
                                    <option value="large-v3">large-v3</option>
                                </select>
                            </div>
                            
                            <div class="form-row">
                                <label for="model_path">模型路径</label>
                                <input type="text" id="model_path" name="model_path" value="/app/models/models--Systran--faster-whisper-tiny">
                            </div>
                            
                            <div class="form-row">
                                <label for="language">语言设置</label>
                                <select id="language" name="language">
                                    <option value="auto">自动检测</option>
                                    <option value="zh" selected>中文</option>
                                    <option value="en">英文</option>
                                    <option value="ja">日语</option>
                                    <option value="ko">韩语</option>
                                    <option value="fr">法语</option>
                                    <option value="de">德语</option>
                                    <option value="es">西班牙语</option>
                                </select>
                            </div>
                            
                            <div class="form-row" style="text-align: left;">
                                <label for="backend">后端</label>
                                <select id="backend" name="backend">
                                    <option value="auto">auto</option>
                                    <option value="mlx-whisper">mlx-whisper</option>
                                    <option value="faster-whisper" selected>faster-whisper</option>
                                    <option value="whisper">whisper</option>
                                    <option value="openai-api">openai-api</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-section">
                            <h3>音频设置</h3>
                            <div class="form-row">
                                <label for="min_chunk_size">最小音频块大小 (秒)</label>
                                <input type="number" id="min_chunk_size" name="min_chunk_size" min="0.01" step="0.01" value="0.15">
                            </div>
                            
                            <div class="form-row">
                                <label for="buffer_trimming_sec">缓冲区修剪阈值 (秒)</label>
                                <input type="number" id="buffer_trimming_sec" name="buffer_trimming_sec" min="1" step="1" value="10">
                            </div>
                            
                            <div class="form-row" style="text-align: left;">
                                <label for="pcm_input">PCM输入</label>
                                <select id="pcm_input" name="pcm_input">
                                    <option value="false">否</option>
                                    <option value="true" selected>是</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-section">
                            <h3>识别设置</h3>
                            <div class="form-row">
                                <label for="confidence_validation">置信度验证</label>
                                <select id="confidence_validation" name="confidence_validation">
                                    <option value="false">否</option>
                                    <option value="true" selected>是</option>
                                </select>
                            </div>
                            
                            <div class="form-row">
                                <label for="beam_size">Beam Size</label>
                                <input type="number" id="beam_size" name="beam_size" min="1" value="5">
                            </div>
                            
                            <div class="form-row">
                                <label for="keywords_file">关键词文件</label>
                                <input type="text" id="keywords_file" name="keywords_file" value="/app/keywords.txt">
                            </div>
                            
                            <div class="form-row" style="text-align: left;">
                                <label for="warmup_file">预热文件</label>
                                <input type="text" id="warmup_file" name="warmup_file" value="/app/samples_zh.wav">
                            </div>
                        </div>
                        
                        <div class="form-section">
                            <h3>说话人识别</h3>
                            <div class="form-row">
                                <label for="diarization">启用说话人识别</label>
                                <select id="diarization" name="diarization">
                                    <option value="false">否</option>
                                    <option value="true">是</option>
                                </select>
                            </div>
                            
                            <div id="diarization-settings-group" style="display: none;">
                                <div class="form-row">
                                    <label for="diarization_model">说话人识别模型</label>
                                    <input type="text" id="diarization_model" name="diarization_model" placeholder="例如: /app/models/models--nvidia--diar_streaming_sortformer_4spk-v2/snapshots/6dbf0d69730bfee097056692b86525a0a23b32f9/diar_streaming_sortformer_4spk-v2.nemo">
                                </div>
                                
                                <div class="form-row" style="text-align: left;">
                                    <label for="punctuation_split">标点分割</label>
                                    <select id="punctuation_split" name="punctuation_split">
                                        <option value="false">否</option>
                                        <option value="true">是</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-section">
                            <h3>唤醒词设置</h3>
                            <div class="form-row">
                                <label for="hotword_enabled">启用唤醒词</label>
                                <select id="hotword_enabled" name="hotword_enabled">
                                    <option value="false">否</option>
                                    <option value="true">是</option>
                                </select>
                            </div>
                            
                            <div id="hotword-settings-group" style="display: none;">
                                <div class="form-row">
                                    <label for="hotword_model_dir">唤醒词模型目录</label>
                                    <input type="text" id="hotword_model_dir" name="hotword_model_dir" placeholder="例如: /app/models/sherpa-onnx-kws-zipformer-wenetspeech">
                                </div>
                                
                                <div class="form-row">
                                    <label for="hotword_threshold">唤醒词阈值 (0.0-1.0)</label>
                                    <input type="number" id="hotword_threshold" name="hotword_threshold" min="0" max="1" step="0.1" value="0.6">
                                </div>
                                
                                <div class="form-row">
                                    <label for="hotword_sample_rate">唤醒词采样率</label>
                                    <input type="number" id="hotword_sample_rate" name="hotword_sample_rate" min="8000" value="16000">
                                </div>
                                
                                <div class="form-row" style="text-align: left;">
                                    <label for="hotword_threads">唤醒词线程数</label>
                                    <input type="number" id="hotword_threads" name="hotword_threads" min="1" value="4">
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-section">
                            <h3>SSL设置</h3>
                            <div class="form-row">
                                <label for="ssl_certfile">SSL证书文件</label>
                                <input type="text" id="ssl_certfile" name="ssl_certfile" placeholder="例如: /app/ssl/cert.pem">
                            </div>
                            
                            <div class="form-row">
                                <label for="ssl_keyfile">SSL密钥文件</label>
                                <input type="text" id="ssl_keyfile" name="ssl_keyfile" placeholder="例如: /app/ssl/key.pem">
                            </div>
                            
                            <div class="form-row" style="text-align: left;">
                                <label for="forwarded_allow_ips">转发允许的IP</label>
                                <input type="text" id="forwarded_allow_ips" name="forwarded_allow_ips" placeholder="例如: 127.0.0.1,192.168.1.0/24">
                            </div>
                        </div>
                        
                        <div class="button-group">
                             <button type="button" class="btn btn-primary" id="btn-reload">应用设置</button>
                            <button type="button" class="btn btn-warning" id="btn-reset">重置为默认值</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
