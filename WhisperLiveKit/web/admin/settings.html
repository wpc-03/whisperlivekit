<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhisperLiveKit 管理系统 - 参数设置</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>WhisperLiveKit 管理系统</h1>
            <div class="user-info">
                <span id="username">加载中...</span>
                <button id="btn-logout" class="btn-logout">登出</button>
            </div>
        </div>
        
        <div class="sidebar">
            <h3>功能导航</h3>
            <ul>
                <li><a href="dashboard.html">控制台</a></li>
                <li><a href="keywords.html">专业术语管理</a></li>
                <li><a href="settings.html" class="active">参数设置</a></li>
                <li><a href="wakewords.html">唤醒词管理</a></li>
            </ul>
        </div>
        
        <div class="content">
            <h2>参数设置</h2>
            
            <div class="form-container">
                <form id="settings-form">
                    <h3>模型设置</h3>
                    <div class="form-row">
                        <label for="model">模型类型</label>
                        <select id="model" name="model">
                            <option value="tiny">tiny</option>
                            <option value="base">base</option>
                            <option value="small">small</option>
                            <option value="medium">medium</option>
                            <option value="large">large</option>
                            <option value="large-v2">large-v2</option>
                            <option value="large-v3">large-v3</option>
                        </select>
                    </div>
                    
                    <div class="form-row">
                        <label for="model_path">模型路径</label>
                        <input type="text" id="model_path" name="model_path" placeholder="例如: D:\\python\\FastWhisperTranscriber\\model\\models--Systran--faster-whisper-small">
                    </div>
                    
                    <div class="form-row">
                        <label for="language">语言设置</label>
                        <select id="language" name="language">
                            <option value="auto">自动检测</option>
                            <option value="zh">中文</option>
                            <option value="en">英文</option>
                            <option value="ja">日语</option>
                            <option value="ko">韩语</option>
                            <option value="fr">法语</option>
                            <option value="de">德语</option>
                            <option value="es">西班牙语</option>
                        </select>
                    </div>
                    
                    <div class="form-row">
                        <label for="backend">后端</label>
                        <select id="backend" name="backend">
                            <option value="auto">auto</option>
                            <option value="mlx-whisper">mlx-whisper</option>
                            <option value="faster-whisper">faster-whisper</option>
                            <option value="whisper">whisper</option>
                            <option value="openai-api">openai-api</option>
                        </select>
                    </div>
                    
                    <h3>音频设置</h3>
                    <div class="form-row">
                        <label for="min_chunk_size">最小音频块大小 (秒)</label>
                        <input type="number" id="min_chunk_size" name="min_chunk_size" min="0.01" step="0.01" value="0.15">
                    </div>
                    
                    <div class="form-row">
                        <label for="buffer_trimming_sec">缓冲区修剪阈值 (秒)</label>
                        <input type="number" id="buffer_trimming_sec" name="buffer_trimming_sec" min="1" step="1" value="15">
                    </div>
                    
                    <div class="form-row">
                        <label for="pcm_input">PCM输入</label>
                        <select id="pcm_input" name="pcm_input">
                            <option value="false">否</option>
                            <option value="true">是</option>
                        </select>
                    </div>
                    
                    <h3>识别设置</h3>
                    <div class="form-row">
                        <label for="confidence_validation">置信度验证</label>
                        <select id="confidence_validation" name="confidence_validation">
                            <option value="false">否</option>
                            <option value="true">是</option>
                        </select>
                    </div>
                    
                    <div class="form-row">
                        <label for="beam_size">Beam Size</label>
                        <input type="number" id="beam_size" name="beam_size" min="1" value="3">
                    </div>
                    
                    <div class="form-row">
                        <label for="keywords_file">关键词文件</label>
                        <input type="text" id="keywords_file" name="keywords_file" placeholder="例如: d:\\python\\whisperlivekit\\keywords_example.txt">
                    </div>
                    
                    <div class="form-row">
                        <label for="warmup_file">预热文件</label>
                        <input type="text" id="warmup_file" name="warmup_file" placeholder="例如: D:\\python\\whisperlivekit\\samples_zh.wav">
                    </div>
                    
                    <h3>说话人识别</h3>
                    <div class="form-row">
                        <label for="diarization">启用说话人识别</label>
                        <select id="diarization" name="diarization">
                            <option value="false">否</option>
                            <option value="true">是</option>
                        </select>
                    </div>
                    
                    <div class="form-row">
                        <label for="diarization_model">说话人识别模型</label>
                        <input type="text" id="diarization_model" name="diarization_model" placeholder="例如: D:\\python\\FastWhisperTranscriber\\model\\models--nvidia--diar_streaming_sortformer_4spk-v2\\snapshots\\6dbf0d69730bfee097056692b86525a0a23b32f9\\diar_streaming_sortformer_4spk-v2.nemo">
                    </div>
                    
                    <div class="form-row">
                        <label for="punctuation_split">标点分割</label>
                        <select id="punctuation_split" name="punctuation_split">
                            <option value="false">否</option>
                            <option value="true">是</option>
                        </select>
                    </div>
                    
                    <h3>唤醒词设置</h3>
                    <div class="form-row">
                        <label for="hotword_model_dir">唤醒词模型目录</label>
                        <input type="text" id="hotword_model_dir" name="hotword_model_dir" placeholder="例如: D:\\python\\FastWhisperTranscriber\\model\\sherpa-onnx-kws-zipformer-wenetspeech">
                    </div>
                    
                    <div class="form-row">
                        <label for="hotword_threshold">唤醒词阈值 (0.0-1.0)</label>
                        <input type="number" id="hotword_threshold" name="hotword_threshold" min="0" max="1" step="0.1" value="0.6">
                    </div>
                    
                    <div class="form-row">
                        <label for="hotword_sample_rate">唤醒词采样率</label>
                        <input type="number" id="hotword_sample_rate" name="hotword_sample_rate" min="8000" value="16000">
                    </div>
                    
                    <div class="form-row">
                        <label for="hotword_threads">唤醒词线程数</label>
                        <input type="number" id="hotword_threads" name="hotword_threads" min="1" value="4">
                    </div>
                    
                    <div class="form-row">
                        <button type="submit" class="btn btn-primary">保存设置</button>
                        <button type="button" class="btn btn-secondary" id="btn-reset">重置为默认值</button>
                    </div>
                </form>
                <div id="settings-message" class="message"></div>
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
