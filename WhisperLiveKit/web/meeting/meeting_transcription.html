<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会议转录 - 实时转录</title>
    <link rel="stylesheet" href="../admin/css/style.css">
    <link rel="stylesheet" href="css/meeting_transcription.css">
</head>
<body>
    <div class="transcription-container">
        <div class="transcription-header">
            <button class="btn-back" id="btn-back">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <div class="meeting-info">
                <div class="meeting-title">2026-03-31 11:17 记录</div>
                <div class="meeting-meta">
                    <span class="meta-item">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                            <polyline points="12,6 12,12 16,14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span id="duration-text">时长 00:00</span>
                    </span>
                    <span id="transcription-status-badge" class="status-badge status-recording">转录中</span>
                </div>
            </div>
        </div>

        <div class="transcription-content" id="transcription-content">
            <div class="transcription-list" id="transcription-list">
                <!-- 动态生成的对话内容将放在这里 -->
            </div>
        </div>

        <div class="recording-panel">
            <div class="recording-indicator">
                <div class="recording-wave">
                    <div class="recording-sprite"></div>
                </div>
                <div class="recording-text">
                    <div class="recording-title">录音中...</div>
                    <div class="recording-time">02:48 / 06:00:00</div>
                </div>
            </div>
            <div class="recording-controls">
                <div class="tooltip-wrapper">
                    <button class="control-btn control-btn-stop" id="btn-stop">
                        <img src="img/stop.svg" alt="结束录音" style="width: 20px; height: 20px;">
                    </button>
                    <div class="tooltip">结束录音</div>
                </div>
                <div class="tooltip-wrapper" id="pause-wrapper">
                    <button class="control-btn control-btn-pause" id="btn-pause">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/>
                            <rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/>
                        </svg>
                    </button>
                    <div class="tooltip" id="pause-tooltip">暂停录音</div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/meeting_transcription.js"></script>
</body>
</html>
