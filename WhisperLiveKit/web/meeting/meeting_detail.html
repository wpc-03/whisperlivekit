<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会议详情</title>
    <link rel="stylesheet" href="../admin/css/style.css">
    <link rel="stylesheet" href="css/meeting_detail.css">
</head>
<body>
    <div class="detail-container">
        <div class="detail-header">
            <button class="btn-back" id="btn-back">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <div class="meeting-title-section">
                <h1 class="meeting-title" id="meeting-title">加载中...</h1>
                <div class="meeting-meta" id="meeting-meta"></div>
            </div>
        </div>

        <div class="audio-player-container" style="padding: 20px 40px; background-color: white; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: center;">
            <audio id="meeting-audio" controls style="width: 100%; max-width: 800px; outline: none;">
                您的浏览器不支持 audio 标签。
            </audio>
        </div>

        <div class="detail-content">
            <div class="transcription-list" id="transcription-list">
                <!-- 动态对话内容将加载到这里 -->
            </div>
        </div>
    </div>
    <script src="js/meeting_detail.js"></script>
</body>
</html>
