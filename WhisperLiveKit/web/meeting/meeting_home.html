<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会议转录系统 - 首页</title>
    <link rel="stylesheet" href="../admin/css/style.css">
    <link rel="stylesheet" href="css/meeting_home.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>会议转录系统</h1>
            <div class="user-info">
                <span id="username">管理员</span>
                <button id="btn-logout" class="btn-logout">退出</button>
            </div>
        </div>
        
        <div class="main-content">
            <div class="sidebar">
                <h3>功能导航</h3>
                <ul>
                    <li><a href="#" class="active" data-page="home">首页</a></li>
                    <li><a href="#" data-page="meetings">会议记录</a></li>
                    <li><a href="meeting_transcription.html">实时转录</a></li>
                </ul>
            </div>
            
            <div class="content">
                <div id="home-content" class="page-content">
                    <div class="page-header">
                        <h2>首页</h2>
                    </div>
                    <div class="dashboard-cards">
                        <div class="stat-card">
                            <div class="stat-label">总会议数</div>
                            <div class="stat-value" id="stat-total-meetings">0</div>
                            <div class="stat-label">个会议</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">录制中</div>
                            <div class="stat-value" id="stat-recording">0</div>
                            <div class="stat-label">个会议</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">已完成</div>
                            <div class="stat-value" id="stat-completed">0</div>
                            <div class="stat-label">个会议</div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-title">快捷操作</div>
                        <div class="quick-actions">
                            <button class="btn btn-primary" id="btn-new-meeting">新建会议</button>
                            <button class="btn btn-secondary" data-action="view-meetings">查看会议记录</button>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-title">最近会议</div>
                        <div class="recent-meetings-list" id="recent-meetings-container">
                            <!-- 动态加载最近会议 -->
                        </div>
                    </div>
                </div>

                <div id="meetings-content" class="page-content" style="display: none;">
                    <div class="page-header">
                        <h2>会议记录</h2>
                        <div class="header-actions">
                            <input type="text" id="search-input" placeholder="搜索会议..." class="form-control" style="padding: 4px 8px; border: 1px solid #d9d9d9; border-radius: 4px;">
                            <button class="btn btn-secondary" id="btn-search">搜索</button>
                            <button class="btn btn-primary" id="btn-new-meeting2">新建会议</button>
                        </div>
                    </div>
                    <div class="meeting-list-wrapper">
                        <div class="meeting-list" id="meeting-list-container">
                            <!-- 动态加载会议列表 -->
                        </div>
                    </div>
                    <div class="pagination">
                        <button class="btn btn-secondary btn-small" id="btn-prev-page">上一页</button>
                        <span class="page-info" id="page-info">第 1 页 / 共 1 页</span>
                        <button class="btn btn-secondary btn-small" id="btn-next-page">下一页</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/meeting_home.js"></script>
</body>
</html>
